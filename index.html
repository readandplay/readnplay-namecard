<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자석글자 이름표 만들기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style id="pageStyle">@page{size:A4 portrait;margin:0}</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#F6F4EF; --panel:#FFFFFF; --ink:#1F1E1B; --muted:#7B756C; --line:#ECE8E0; --soft:#F9F7F3;
    --red:#E5301F; --blue:#214396;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}

  /* 맨 위 로고 줄 */
  .topbar{background:#fff;border-bottom:1px solid var(--line)}
  .topbar-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
  .topbar img{height:34px;width:auto;display:block}
  .topbar .divider{width:1px;height:22px;background:var(--line)}
  .topbar .prod{font-weight:700;font-size:15px;letter-spacing:-0.01em}
  .topbar .prod span{color:var(--muted);font-weight:500;margin-left:6px}

  .hero{max-width:1120px;margin:0 auto;padding:28px 16px 12px}
  .hero h1{margin:0;font-size:clamp(24px,4vw,32px);letter-spacing:-0.03em;line-height:1.25}
  .hero h1 .c{color:var(--red)} .hero h1 .v{color:var(--blue)}
  .hero p{margin:8px 0 0;color:var(--muted);font-size:15px}

  main{max-width:1120px;margin:0 auto;padding:12px 16px 48px;display:grid;gap:20px}
  @media(min-width:880px){main{grid-template-columns:360px 1fr;align-items:start}
    .panel{position:sticky;top:16px}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 20px 20px}
  .sec{padding:18px 0;border-bottom:1px solid var(--line)}
  .sec:last-of-type{border-bottom:0}
  .sec-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:12px}
  .num{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:grid;place-items:center}
  .field+.field{margin-top:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  input[type=text],textarea{width:100%;resize:none;overflow:hidden;display:block;line-height:1.35;font-size:22px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;
    background:var(--soft);font-family:inherit;font-weight:700;letter-spacing:0.02em;transition:border-color .15s,background .15s}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--blue);background:#fff}
  .hint{color:#aaa39a}
  .note{font-size:12.5px;color:var(--muted);margin-top:5px;min-height:1em}
  .warn{color:#B3261E;font-weight:600}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .seg button{padding:12px 8px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .15s,box-shadow .15s}
  .seg button:hover{border-color:#d6d0c5}
  .seg button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .seg .big{font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-0.02em}
  .seg small{font-size:12px;color:var(--muted);font-weight:500}
  .c{color:var(--red)} .v{color:var(--blue)}

  .modebox{background:#FFF7E6;border:1px solid #F5E2B8;border-radius:14px;padding:14px;margin:14px 0 0}
  .modebox .sec-h{margin-bottom:10px;color:#8A5A00}
  .modebox .seg .big{font-size:16px}

  .swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;transition:box-shadow .15s}
  .sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
  .sw-custom{position:relative;overflow:hidden;background:conic-gradient(#f66,#fd5,#7d7,#6cf,#88f,#f6c,#f66)}
  .sw-custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

  .actions{display:grid;gap:8px;margin-top:4px}
  .actions button{padding:15px;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer;transition:transform .05s,background .15s}
  .actions button:active{transform:scale(.99)}
  .primary{background:var(--ink);color:#fff;border:0}
  .primary:hover{background:#000}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .secondary{background:#fff;border:1.5px solid var(--line);font-size:15px!important}
  .secondary:hover{border-color:var(--ink)}
  .tip{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.55}

  .stage{background:#E9E5DD;border-radius:20px;padding:18px 16px 22px}
  .stage-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin:0 4px 14px}
  .stage-h b{color:var(--ink);font-weight:700}
  .preview{display:flex;flex-direction:column;align-items:center;gap:18px}
  .preview svg{width:100%;max-width:600px;height:auto;background:#fff;border-radius:2px;
    box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 32px rgba(40,30,10,.12)}

  footer{max-width:1120px;margin:0 auto;padding:0 16px 32px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
  footer img{height:20px;opacity:.55}

  @media print{
    body{background:#fff}
    .topbar,.hero,.panel,.stage-h,footer{display:none!important}
    main{display:block;padding:0;margin:0;max-width:none}
    .stage{padding:0;background:none;border-radius:0}
    .preview{display:block}
    .preview svg{width:210mm;height:297mm;max-width:none;box-shadow:none;border-radius:0;display:block}
    .preview svg:not(:last-child){break-after:page}
    .preview svg.land{width:297mm;height:210mm}
  }
</style>
</head>

const VOWEL = {

  "ㅟ":{h:A(90),v:[I(0)]}, "ㅠ":{h:YA(90)}, "ㅡ":{h:I(90)}, "ㅢ":{h:I(90),v:[I(0)]}, "ㅣ":{v:[I(0)]}

/* ===== 4. 조각 크기와 모양 윤곽 ===== */
function dims(base, rot){ const p=PIECES[base]; return (rot%180) ? {w:p.h,h:p.w} : {w:p.w,h:p.h}; }
function transformOf(it){
  const p=PIECES[it.base], x=it.x, y=it.y;
  switch(it.rot){
    case 90:  return `translate(${x+p.h} ${y}) rotate(90)`;
    case 180: return `translate(${x+p.w} ${y+p.h}) rotate(180)`;
    case 270: return `translate(${x} ${y+p.w}) rotate(-90)`;
    default:  return `translate(${x} ${y})`;
  }
}
// 각 줄(0.25mm)마다 조각이 차지하는 왼쪽/오른쪽 끝을 기억해 두면, 조각끼리 맞물리게 붙일 수 있어요.
const RES = 4, profileCache = {};
function profile(base, rot){
  const key = base+rot; if(profileCache[key]) return profileCache[key];
  const d = dims(base, rot), W = Math.ceil(d.w*RES)+2, H = Math.ceil(d.h*RES)+2;
  const cv = document.createElement("canvas"); cv.width=W; cv.height=H;
  const ctx = cv.getContext("2d"); ctx.scale(RES,RES);
  const m = transformOf({base,rot,x:0,y:0}).match(/translate\(([-\d.]+) ([-\d.]+)\)(?: rotate\(([-\d.]+)\))?/);
  ctx.translate(+m[1], +m[2]); if(m[3]) ctx.rotate(+m[3]*Math.PI/180);
  ctx.fill(new Path2D(PIECES[base].d));
  const data = ctx.getImageData(0,0,W,H).data, rows=[];
  for(let r=0;r<H;r++){ let L=-1,R=-1;
    for(let c=0;c<W;c++){ if(data[(r*W+c)*4+3]>100){ if(L<0)L=c; R=c; } }
    rows.push(L<0?null:[L/RES,(R+1)/RES]); }
  return profileCache[key]=rows;
}
// group(이미 놓인 조각들) 오른쪽에 item을 gap만큼 띄워서 최대한 붙이는 x 위치
function snugRightX(group, base, rot, y, gap, vgap=gap){
  const right = new Map();
  for(const g of group){ profile(g.base,g.rot).forEach((r,i)=>{ if(!r)return;
      const row=Math.round(g.y*RES)+i, v=g.x+r[1]; if(!(right.get(row)>=v)) right.set(row,v); }); }
  const pad=Math.ceil(vgap*RES); let x=-Infinity;
  profile(base,rot).forEach((r,i)=>{ if(!r)return; const row=Math.round(y*RES)+i;
    for(let k=row-pad;k<=row+pad;k++){ const gr=right.get(k); if(gr!==undefined) x=Math.max(x, gr+gap-r[0]); } });
  if(x===-Infinity) x=Math.max(...group.map(g=>g.x+g.w))+gap;
  return x;
}

/* ===== 5. 한 글자(음절) 배치 ===== */
const isJamo = ch => ch>="ㄱ" && ch<="ㅣ";
// 자음이나 모음 하나만 쓸 때 (ㄱ, ㄴ, ㅏ, ㅘ, ㄳ …)
function layoutJamo(ch){
  const items=[];
  const add=(base,rot,x,y,kind)=>{ const d=dims(base,rot); const it={base,rot,x,y,w:d.w,h:d.h,kind}; items.push(it); return it; };
  const V = VOWEL[ch];
  if(!V){ // 자음 (겹자음 ㄳ 같은 건 두 조각을 나란히)
    let x=0; [...(JONG_SPLIT[ch]||ch)].forEach(p=>{ if(!PIECES[p] && p!=="ㄴ") return; const it=add(p,0,x,0,"c"); x+=it.w+2; });
  } else if(V.h){ // ㅗ ㅜ ㅡ (+ 오른쪽 모음): 글자 안에 있을 때와 같은 자리 관계로 놓아요
    const hb=dims(...V.h), cH=27, barY=cH+GAP.cvH, groupH=barY+hb.h;
    add(V.h[0],V.h[1],0,barY,"v");
    let prev=null;
    (V.v||[]).forEach(([b,r],i)=>{ const d=dims(b,r), y=(groupH-d.h)/2;
      const x = i===0 ? snugRightX(items,b,r,y,GAP.hv) : prev.x+prev.w+GAP.vv; prev=add(b,r,x,y,"v"); });
  } else {
    let x=0; V.v.forEach(([b,r])=>{ const it=add(b,r,x,0,"v"); x+=it.w+GAP.vv; });
  }
  normalize(items); const b=bbox(items);
  return {items, w:b.w, h:b.h, ch};
}
function layoutSyllable(ch, tall=false){
  if(isJamo(ch)) return layoutJamo(ch);
  const code = ch.charCodeAt(0)-0xAC00;
  const cho = CHO[Math.floor(code/588)], jung = JUNG[Math.floor((code%588)/28)], jong = JONG[code%28];
  const V = VOWEL[jung], items=[];
  const add=(base,rot,x,y,kind)=>{ const d=dims(base,rot); const it={base,rot,x,y,w:d.w,h:d.h,kind}; items.push(it); return it; };
  const C = dims(cho,0);
  if(V.h){
    const hb = dims(...V.h);
    // 이름 안에 받침 있는 글자가 있으면, 받침 없는 '주'같은 글자는 자음과 아래 모음 사이를 조금 벌려 길이를 맞춰요
    const cvH = (tall && !jong) ? GAP.cvHtall : GAP.cvH;
    add(cho,0,(hb.w-C.w)/2,0,"c");
    add(V.h[0],V.h[1],0,C.h+cvH,"v");
    if(V.v){
      const groupH = C.h+cvH+hb.h;
      let prev=null;
      V.v.forEach(([b,r],i)=>{ const d=dims(b,r), y=(groupH-d.h)/2;
        const x = i===0 ? snugRightX(items,b,r,y,GAP.hv) : prev.x+prev.w+GAP.vv;
        prev=add(b,r,x,y,"v"); });
    }
  } else {
    const vh = dims(...V.v[0]).h;
    add(cho,0,0,(vh-C.h)/2,"c");
    // 밝·앉처럼 받침이 자음 두 개면, 위의 자음과 모음 사이를 5mm 더 띄워서 넓은 받침과 어울리게 해요
    const dbl = !!(jong && JONG_SPLIT[jong]);
    let x = C.w+GAP.cv+(dbl?GAP.dblJong:0);
    V.v.forEach(([b,r],i)=>{
      // ㅓ·ㅔ·ㅕ·ㅖ는 튀어나온 부분이 ㄴ·ㄷ·ㅅ·ㅈ·ㅊ처럼 오른쪽이 열린 자음 사이로 들어가요 (ㄱ처럼 막힌 자음은 그대로)
      if(i===0 && !dbl && "ㅓㅔㅕㅖ".includes(jung) && "ㄴㄷㅅㅈㅊㅍ".includes(cho)){
        // 자음을 위아래로 살짝(±1.5mm) 움직여 보며 ㅓ가 가장 깊이 들어가는 자리를 찾아요
        const c0=items[0], y0=c0.y; let best={x:Infinity,dy:0};
        for(let dy=-1.5; dy<=1.5; dy+=0.25){ c0.y=y0+dy;
          // ㄷ은 빈칸이 꼭 맞아서 조금 더 바깥에, ㅍ은 오른쪽 홈이 얕아서 튀어나온 부분만 1mm까지 다가가요
          // ㅍ: ㅓ·ㅔ는 홈에 들어가되 2mm 띄우고, ㅕ·ㅖ는 튀어나온 곳이 두 개라 홈에 안 들어가서 2.5mm까지만 다가가요
          const g = cho==="ㄷ" ? GAP.eTuck+GAP.eTuckD : cho==="ㅍ" ? ("ㅓㅔ".includes(jung) ? 2 : 2.5) : GAP.eTuck;
          const sx=snugRightX(items,b,r,0,g,cho==="ㄷ"?0:1);
          if(sx<best.x-0.01 || (Math.abs(sx-best.x)<=0.01 && Math.abs(dy)<Math.abs(best.dy))) best={x:sx,dy}; }
        c0.y=y0+best.dy; x=Math.min(x,best.x);
      }
      const it=add(b,r,x,0,"v"); x+=it.w+GAP.vv; });
  }
  normalize(items);
  if(jong){
    const parts=[...(JONG_SPLIT[jong]||jong)], top=bbox(items);
    const ds=parts.map(p=>dims(p,0)), jw=ds.reduce((s,d)=>s+d.w,0)+(parts.length-1)*2;
    // 모음이 오른쪽에 있으면 받침을 모음 오른쪽 끝에 맞추고, 모음이 아래에만 있으면 가운데에 놓아요
    // ㅏ, ㅑ는 오른쪽으로 튀어나온 부분을 빼고 세로 막대(ㅣ 부분)의 오른쪽 끝을 기준으로 해요
    const barRight = it => (it.rot===0 && (it.base==="ㅏ"||it.base==="ㅑ")) ? it.x+PIECES["ㅣ"].w : it.x+it.w;
    const vert = items.filter(it=>it.kind==="v" && it.h>it.w);
    // 원·윈·왠처럼 모음이 아래와 오른쪽에 다 있으면, 오른쪽 끝에서 2mm 안쪽으로 들여요
    let x = V.v ? Math.max(...vert.map(barRight))-jw-(V.h?GAP.jongIn:0) : (top.w-jw)/2;
    // 밝·앉처럼 서로 다른 자음 두 개짜리 받침은 위 글자와 가운데를 맞춰요
    if(parts.length===2) x=(top.w-jw)/2;
    const y=top.h+GAP.jong;
    parts.forEach((p,i)=>{ add(p,0,x,y,"c"); x+=ds[i].w+2; });
    normalize(items);
  }
  const b=bbox(items);
  return {items, w:b.w, h:b.h, ch};
}
function bbox(items){ const x0=Math.min(...items.map(i=>i.x)), y0=Math.min(...items.map(i=>i.y));
  return {x0,y0,w:Math.max(...items.map(i=>i.x+i.w))-x0, h:Math.max(...items.map(i=>i.y+i.h))-y0}; }
function normalize(items){ const b=bbox(items); items.forEach(i=>{i.x-=b.x0;i.y-=b.y0;}); }

/* ===== 6. 이름(한 줄 또는 두 줄)을 카드 안에 배치 ===== */
const okChar = c => (c>="가"&&c<="힣")||(c>="ㄱ"&&c<="ㅣ");
// Enter로 줄을 바꾸면 두 줄 카드가 돼요 (최대 두 줄)
function cleanName(s){ return s.split(/\r?\n/).map(l=>[...l].filter(okChar).join("")).filter(Boolean).slice(0,2).join("\n"); }
const flat = name => name.replace(/\n/g,"");
const fitsIn=(sum,n,inner)=> sum+(n+1)*GAP.minSyl <= inner;
const hasJong = ch => ch>="가" && ch<="힣" && (ch.charCodeAt(0)-0xAC00)%28!==0;
function layoutLine(line, inner, tall){
  const syl=[...line].map(c=>layoutSyllable(c,tall));
  const sum=syl.reduce((s,x)=>s+x.w,0);
  const gap = Math.min(14, Math.max(GAP.minSyl,(inner-sum)/(syl.length+1))); // 짧은 이름이 너무 벌어지지 않게
  const totalW = sum+gap*(syl.length-1);
  return {syl, gap, startX:(inner-totalW)/2, fits:fitsIn(sum,syl.length,inner), sum, h:Math.max(0,...syl.map(s=>s.h))};
}
function layoutName(name, mode){
  const lines=name.split("\n").filter(Boolean);
  const tall=[...flat(name)].some(hasJong);
  // 카드 크기는 늘 같아요 (잘라서 보관할 때 크기가 똑같도록). 두 줄이면 A4 가로에 세로로 긴 카드
  const card = lines.length>1 ? {...CARD_LAND2} : mode==="landscape" ? {...CARD_LAND} : {...CARD};
  const inner=card.w-2*card.border;
  const L=lines.map(l=>layoutLine(l,inner,tall));
  return {lines:L, card, inner, fits:L.every(l=>l.fits), sum:Math.max(0,...L.map(l=>l.sum))};
}
function usage(name){
  const u={};
  for(const s of [...flat(name)].map(c=>layoutSyllable(c))) for(const it of s.items){ const g=STOCK_GROUP(it.base); u[g]=(u[g]||0)+1; }
  return Object.entries(u).filter(([g,n])=>n>stockOf(g)).map(([g,n])=>`${g} ${n}개 필요 (한 세트 ${stockOf(g)}개)`);
}

/* ===== 7. A4 도안 그리기 (SVG, 단위 mm) ===== */
const state={scheme:"A", border:BORDERS[0], logo:true, mode:"portrait"};
function cardSvg(name, y, mode, cCol, vCol){
  const L=layoutName(name, mode), c=L.card;
  const ix=c.x+c.border, iy=y+c.by, ih=c.h-2*c.by;
  let s=`<rect x="${c.x}" y="${y}" width="${c.w}" height="${c.h}" fill="${state.border}"/>`;
  s+=`<rect x="${ix}" y="${iy}" width="${L.inner}" height="${ih}" rx="${c.radius}" fill="#fff"/>`;
  // 로고는 항상 넣어요: 위쪽 테두리 오른쪽 모서리, 둥근 모서리 바깥의 넓은 회색 부분에 흰색으로 연하게
  { const lh=6, lw=lh*LOGO_RATIO, m=1.6;
    s+=`<image href="${LOGO_WHITE}" x="${c.x+c.w-m-lw}" y="${y+m*0.6}" width="${lw}" height="${lh}" opacity="0.9"/>`; }
  // 두 줄이면 줄 사이를 12mm 띄우고, 두 줄을 묶어서 카드 가운데에 놓아요
  const lineGap=12, total=L.lines.reduce((s,l)=>s+l.h,0)+lineGap*(L.lines.length-1);
  let ly=iy+(ih-total)/2;
  L.lines.forEach((ln,li)=>{
    let x=ix+ln.startX; const top=ly; ly+=ln.h+lineGap;
    ln.syl.forEach(sy=>{
      const oy=top+(ln.h-sy.h)/2;
      sy.items.forEach(it=>{ s+=`<path d="${PIECES[it.base].d}" fill="${it.kind==="c"?cCol:vCol}" transform="${transformOf({...it,x:x+it.x,y:oy+it.y})}"/>`; });
      x+=sy.w+ln.gap;
    });
  });
  return s;
}
function pageSvg(P, body){
  let s=`<svg xmlns="http://www.w3.org/2000/svg" class="${P.w>P.h?"land":"port"}" viewBox="0 0 ${P.w} ${P.h}" width="${P.w}mm" height="${P.h}mm"><rect width="${P.w}" height="${P.h}" fill="#fff"/>`+body;
  return s+`</svg>`;
}
function render(){
  const names=[n1.value,n2.value].map(cleanName);
  const cCol = state.scheme==="A"?RED:BLUE, vCol = state.scheme==="A"?BLUE:RED;
  // 두 줄로 쓴 이름이 있으면 A4 가로로 만들어요 (이름마다 한 장씩)
  const twoLine = names.some(n=>n.includes("\n"));
  const mode = twoLine ? "landscape" : state.mode;
  // 세로 2개로 안 들어가는 이름이 있으면 '가로' 선택지를 보여 줘요
  const tooLong = !twoLine && names.some(n=>n && !layoutName(n,"portrait").fits);
  modeBox.hidden = twoLine || !(tooLong || state.mode==="landscape");
  modeP.setAttribute("aria-pressed", state.mode==="portrait");
  modeL.setAttribute("aria-pressed", state.mode==="landscape");
  let html="";
  if(mode==="landscape"){
    names.filter(Boolean).forEach(n=>{
      const y = n.includes("\n") ? CARD_LAND2.y : CARD_LAND.y;
      html+=pageSvg(PAGE_LAND, cardSvg(n, y, "landscape", cCol, vCol)); });
    if(!html) html=pageSvg(PAGE_LAND,"");
  } else {
    html=pageSvg(PAGE, names.map((n,k)=>cardSvg(n, CARD.ys[k], "portrait", cCol, vCol)).join(""));
  }
  preview.innerHTML=html;
  pageStyle.textContent = mode==="landscape" ? "@page{size:A4 landscape;margin:0}" : "@page{size:A4 portrait;margin:0}";
  names.forEach((name,k)=>{
    const L=layoutName(name, mode);
    const note=document.getElementById("note"+(k+1)), raw=[n1,n2][k].value.replace(/\s/g,"");
    const msgs=[];
    if(raw.length!==flat(name).length) msgs.push("한글(글자, 자음, 모음)만 들어가요. 줄은 두 줄까지 돼요.");
    if(name && !L.fits) msgs.push(mode==="landscape"
      ? `글자가 너무 길어서 가로 카드에도 다 들어가지 않아요 (약 ${Math.round(L.sum)}mm). Enter로 줄을 나눠 보세요.`
      : `글자가 카드보다 길어요 (약 ${Math.round(L.sum)}mm). 아래에서 'A4 가로'를 고르거나, Enter로 두 줄로 나눠 보세요.`);
    msgs.push(...usage(name).map(m=>"조각이 모자라요: "+m));
    const n=[...flat(name)].length, two=name.includes("\n");
    note.innerHTML = msgs.length? `<span class="warn">${msgs.join("<br>")}</span>`
      : (name? `${n}글자${two?" · 두 줄 · A4 가로 한 장에 크게":""} · 실제 크기 그대로예요`:"");
  });
}

/* ===== 8. 저장하기 ===== */
function fileBase(){ return "이름표_"+[n1.value,n2.value].map(cleanName).map(flat).filter(Boolean).join("_"); }
function toCanvas(svgEl){
  return new Promise((res,rej)=>{
    const land=svgEl.classList.contains("land"), W=land?3508:2480, H=land?2480:3508, img=new Image();
    img.onload=()=>{ const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
      const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
      ctx.drawImage(img,0,0,W,H); res(cv); };
    img.onerror=rej;
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgEl.outerHTML);
  });
}
function download(url,name){ const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function pageFileName(i,total){
  if(total===1) return fileBase();
  return "이름표_"+[n1.value,n2.value].map(cleanName).map(flat).filter(Boolean)[i];
}
savePng.onclick=async()=>{
  const pages=[...preview.querySelectorAll("svg")];
  for(let i=0;i<pages.length;i++){
    const cv=await toCanvas(pages[i]);
    await new Promise(r=>cv.toBlob(b=>{ const u=URL.createObjectURL(b); download(u,pageFileName(i,pages.length)+".png"); setTimeout(()=>URL.revokeObjectURL(u),2000); setTimeout(r,400); },"image/png"));
  }
};
savePdf.onclick=async()=>{
  if(!window.jspdf){ alert("PDF 저장은 인터넷이 연결되어 있을 때 쓸 수 있어요. '바로 인쇄하기'에서 PDF로 저장해도 돼요."); return; }
  const pages=[...preview.querySelectorAll("svg")]; let pdf=null;
  for(const p of pages){
    const land=p.classList.contains("land"), o=land?"landscape":"portrait", w=land?297:210, h=land?210:297;
    if(!pdf) pdf=new jspdf.jsPDF({orientation:o,unit:"mm",format:"a4"}); else pdf.addPage("a4",o);
    const cv=await toCanvas(p); pdf.addImage(cv.toDataURL("image/jpeg",0.95),"JPEG",0,0,w,h);
  }
  pdf.save(fileBase()+".pdf");
};
document.getElementById("print").onclick=()=>window.print();
modeP.onclick=()=>{state.mode="portrait";render();};
modeL.onclick=()=>{state.mode="landscape";render();};

/* ===== 9. 화면 조작 ===== */
const sw=document.getElementById("swatches");
BORDERS.forEach((c,i)=>{ const b=document.createElement("button"); b.className="sw"; b.style.background=c; b.setAttribute("aria-label","테두리 색 "+c);
  b.setAttribute("aria-pressed",i===0); b.onclick=()=>pickBorder(c,b); sw.appendChild(b); });
const custom=document.createElement("label"); custom.className="sw sw-custom"; custom.title="직접 고르기";
custom.innerHTML=`<input type="color" value="#C5C5C5" aria-label="테두리 색 직접 고르기">`; sw.appendChild(custom);
custom.querySelector("input").oninput=e=>pickBorder(e.target.value,custom);
function pickBorder(c,el){ state.border=c; sw.querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed",x===el)); render(); }
schemeA.onclick=()=>{state.scheme="A";schemeA.setAttribute("aria-pressed",true);schemeB.setAttribute("aria-pressed",false);render();};
schemeB.onclick=()=>{state.scheme="B";schemeB.setAttribute("aria-pressed",true);schemeA.setAttribute("aria-pressed",false);render();};
// 입력 칸: 줄 수에 맞게 높이가 늘어나고, 줄은 두 줄까지만
function fit(el){ el.style.height="auto"; el.style.height=el.scrollHeight+"px"; }
[n1,n2].forEach(el=>{
  el.addEventListener("keydown",e=>{ if(e.key==="Enter" && el.value.includes("\n")) e.preventDefault(); });
  el.addEventListener("input",()=>{ fit(el); render(); });
  fit(el);
});
render();
</script>
</body>
